<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>LinkedIn AI Bot Dashboard</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        window.CSRF_TOKEN = {{ csrf_token|tojson }};
        (function () {
            const origFetch = window.fetch;
            window.fetch = function (resource, init) {
                const url = typeof resource === 'string' ? resource : (resource && resource.url) || '';
                const isSameOrigin = url.startsWith('/') || url.startsWith(window.location.origin);
                if (isSameOrigin) {
                    const opts = Object.assign({}, init || {});
                    const headers = new Headers(opts.headers || (resource instanceof Request ? resource.headers : undefined) || {});
                    if (!headers.has('X-CSRF-Token')) {
                        headers.set('X-CSRF-Token', window.CSRF_TOKEN);
                    }
                    opts.headers = headers;
                    return origFetch.call(this, resource, opts);
                }
                return origFetch.call(this, resource, init);
            };
        })();
    </script>
    {% block head %}{% endblock %}
</head>

<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script>
        // Common interactions
        document.addEventListener('DOMContentLoaded', () => {
            // Add slight stagger to card animations
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                card.style.animationDelay = `${index * 0.1}s`;
            });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
